[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraliquid-mcp"
version = "1.0.1"
description = "Inspect the NeuraLiquid x402 offer and read a previously purchased signal pass"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1"]

[project.scripts]
neuraliquid-mcp = "neuraliquid_mcp:main"

[tool.setuptools]
py-modules = ["neuraliquid_mcp"]
